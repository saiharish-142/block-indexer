  redis:
    image: redis:7
    container_name: explorer-redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2
    container_name: explorer-nats
    ports:
      - "4222:4222"
      - "8222:8222"

  evm-indexer:
    image: golang:1.22
    working_dir: /app
    command: sh -c "go run ./services/evm-indexer"
    env_file:
      - .env.example
    environment:
      CONFIG_PATH: /app/configs/common.yaml
      EVM_INDEXER_CONFIG: /app/configs/evm-indexer.yaml
    volumes:
      - ./:/app
    depends_on:
      # - postgres
      - nats

